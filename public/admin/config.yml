# ─────────────────────────────────────────────────────────────────────────
# Sveltia CMS — configuration de l'éditeur de contenu
#
# Ce fichier décrit les formulaires que voit l'éditeur sur /admin.
# Chaque « Enregistrer » devient un commit Git ; Cloudflare Pages republie
# le site automatiquement en 1 à 2 minutes. Aucune base de données.
#
# Format compatible Decap/Netlify CMS. Docs : https://sveltiacms.app
#
# ⚠️  DEUX valeurs sont à compléter une seule fois lors de l'installation
#     (voir SETUP.md, étapes GitHub + Cloudflare) : `repo` et `base_url`.
# ─────────────────────────────────────────────────────────────────────────

backend:
  name: github
  repo: atlantiqueolympiqueclub-max/atlantiqueolympique.club
  branch: main
  base_url: https://sveltia-cms-auth.atlantiqueolympiqueclub.workers.dev   # URL du worker d'authentification (SETUP.md §5)

# Permet de tester l'éditeur en local sans authentification, via le proxy
# « npx @sveltia/cms-proxy-server » (facultatif). Sans effet en production :
# actif uniquement sur localhost.
local_backend: true

# Remarque : les libellés des champs ci-dessous sont en français. L'interface de
# Sveltia (boutons « Enregistrer », etc.) suit la langue du navigateur de l'éditeur.

# Dossier où sont enregistrées les images téléversées + URL publique correspondante.
media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  # ───────────────────────────── ATHLÈTES ─────────────────────────────
  - name: athletes
    label: "Athlètes"
    label_singular: "Athlète"
    description: "Les nageurs du club (section « Le club »)."
    folder: "src/content/athletes"
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: name
    format: yaml-frontmatter
    summary: "{{name}}"
    sortable_fields: [order, name]
    fields:
      - { name: name, label: "Nom", widget: string }
      - { name: photo, label: "Photo", widget: image, hint: "Portrait de l'athlète. Formats conseillés : JPG ou PNG." }
      - { name: discipline, label: "Discipline", widget: string, required: false, hint: "Ex. : 100 m nage libre, 4 nages…" }
      - name: palmares
        label: "Palmarès"
        widget: list
        required: false
        summary: "{{fields.entry}}"
        field: { name: entry, label: "Titre / résultat", widget: string }
      - { name: order, label: "Ordre d'affichage", widget: number, default: 0, value_type: int, hint: "Plus le nombre est petit, plus l'athlète apparaît tôt." }

  # ──────────────────────────── STAFF / ÉQUIPE ────────────────────────
  - name: team
    label: "Staff / Encadrement"
    label_singular: "Membre du staff"
    description: "Entraîneurs et encadrants (carrousel « L'équipe AOC »)."
    folder: "src/content/team"
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: name
    format: yaml-frontmatter
    summary: "{{name}} — {{role}}"
    sortable_fields: [order, name]
    fields:
      - { name: name, label: "Nom", widget: string }
      - { name: role, label: "Fonction", widget: string, hint: "Ex. : Entraîneur principal, Préparateur physique…" }
      - { name: photo, label: "Photo", widget: image }
      - { name: bio, label: "Présentation", widget: text, required: false, hint: "Une ou deux phrases." }
      - { name: order, label: "Ordre d'affichage", widget: number, default: 0, value_type: int }

  # ───────────────────────────── ÉVÉNEMENTS ───────────────────────────
  - name: events
    label: "Événements"
    label_singular: "Événement"
    description: "Calendrier (« Prochains événements »). Passé/à venir est calculé automatiquement d'après la date."
    folder: "src/content/events"
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: title
    format: yaml-frontmatter
    summary: "{{title}} — {{date}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: "Titre", widget: string }
      - { name: image, label: "Image", widget: image }
      - { name: date, label: "Date", widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
      - { name: time, label: "Horaire", widget: string, required: false, hint: "Ex. : 09h00   ou   14h00 – 19h00" }
      - { name: location, label: "Lieu", widget: string, required: false }
      - { name: description, label: "Description", widget: text, required: false }
      - { name: sourceUrl, label: "Lien externe (facultatif)", widget: string, required: false, pattern: ['^(https?://.+)?$', 'Doit commencer par https://'], hint: "Page officielle, billetterie, etc." }

  # ──────────────────────────────── BLOG ──────────────────────────────
  - name: blog
    label: "Blog"
    label_singular: "Article"
    description: "Actualités et articles du club."
    folder: "src/content/blog"
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: title
    format: yaml-frontmatter
    summary: "{{title}} — {{date}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: "Titre", widget: string }
      - { name: date, label: "Date", widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
      - { name: cover, label: "Image de couverture", widget: image }
      - { name: excerpt, label: "Résumé", widget: text, hint: "1 à 2 phrases affichées dans la liste des articles." }
      - { name: featured, label: "Mettre à la une", widget: boolean, default: false, hint: "Article mis en avant sur la page d'accueil." }
      - name: tags
        label: "Étiquettes"
        widget: list
        required: false
        summary: "{{fields.tag}}"
        field: { name: tag, label: "Étiquette", widget: string }
      - { name: body, label: "Contenu de l'article", widget: markdown }

  # ─────────────────────────────── GALERIE ────────────────────────────
  - name: gallery
    label: "Galerie"
    label_singular: "Photo"
    description: "Photos de la galerie (« Notre galerie »)."
    folder: "src/content/gallery"
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: title
    format: yaml-frontmatter
    summary: "{{title}}"
    sortable_fields: [order, date]
    fields:
      - { name: image, label: "Photo", widget: image }
      - { name: title, label: "Titre", widget: string, required: false }
      - { name: eventName, label: "Événement associé", widget: string, required: false }
      - { name: date, label: "Date", widget: datetime, date_format: "YYYY-MM-DD", time_format: false, required: false, picker_utc: true }
      - { name: order, label: "Ordre d'affichage", widget: number, default: 0, value_type: int }

  # ────────────────────────────── PARTENAIRES ─────────────────────────
  - name: partners
    label: "Partenaires"
    label_singular: "Partenaire"
    description: "Logos des fédérations et partenaires."
    folder: "src/content/partners"
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: name
    format: yaml-frontmatter
    summary: "{{name}}"
    sortable_fields: [order, name]
    fields:
      - { name: name, label: "Nom", widget: string }
      - { name: logo, label: "Logo", widget: image }
      - { name: url, label: "Site web", widget: string, required: false, pattern: ['^(https?://.+)?$', 'Doit commencer par https://'] }
      - { name: order, label: "Ordre d'affichage", widget: number, default: 0, value_type: int }

  # ─────────────────────── RÉGLAGES (fichiers uniques) ─────────────────
  - name: settings
    label: "Réglages du site"
    description: "Textes d'accueil, coordonnées et informations générales."
    files:
      - name: home
        label: "Page d'accueil — textes"
        file: "src/data/home.md"
        format: yaml-frontmatter
        fields:
          - { name: heroTitle, label: "Titre principal (bandeau d'accueil)", widget: string }
          - { name: heroAccent, label: "Mot mis en couleur", widget: string, hint: "Ce mot du titre s'affiche en couleur. Ex. : « Olympique »." }
          - { name: heroSubtitle, label: "Sous-titre (bandeau d'accueil)", widget: text }
          - { name: aboutTitle, label: "Titre « Qui sommes-nous ? »", widget: string }
          - { name: aboutLead, label: "Accroche « Qui sommes-nous ? »", widget: string }
          - { name: body, label: "Texte « Qui sommes-nous ? »", widget: markdown }

      - name: contact
        label: "Contact"
        file: "src/data/contact.json"
        fields:
          - { name: phone, label: "Téléphone", widget: string }
          - { name: phoneSecondary, label: "Téléphone secondaire", widget: string, required: false }
          - { name: email, label: "E-mail", widget: string }
          - name: address
            label: "Emplacement (fixe — normalement à ne pas modifier)"
            widget: object
            collapsed: true
            fields:
              - { name: street, label: "Lieu", widget: string }
              - { name: city, label: "Ville", widget: string }
              - { name: country, label: "Pays", widget: string }
          - name: map
            label: "Carte (fixe — ne pas modifier sans raison)"
            widget: object
            collapsed: true
            fields:
              - { name: lat, label: "Latitude", widget: number, value_type: float }
              - { name: lng, label: "Longitude", widget: number, value_type: float }
              - { name: zoom, label: "Zoom", widget: number, value_type: int }
              - { name: label, label: "Étiquette de la carte", widget: string }

      - name: site
        label: "Général & navigation"
        file: "src/data/site.json"
        fields:
          - { name: name, label: "Nom du club", widget: string }
          - { name: shortName, label: "Sigle", widget: string }
          - { name: tagline, label: "Devise", widget: string }
          - { name: description, label: "Description (référencement / SEO)", widget: text }
          - { name: copyrightYear, label: "Année (bas de page)", widget: number, value_type: int }
          - name: nav
            label: "Menu de navigation"
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { name: label, label: "Libellé", widget: string }
              - { name: href, label: "Lien", widget: string, hint: "Ex. : /galerie   ou   /#contact" }
          - name: stats
            label: "Chiffres clés (compteurs animés)"
            widget: list
            summary: "{{fields.value}}{{fields.suffix}} — {{fields.label}}"
            fields:
              - { name: value, label: "Nombre", widget: number, value_type: int }
              - { name: suffix, label: "Suffixe", widget: string, required: false, hint: "Ex. : +" }
              - { name: label, label: "Libellé", widget: string }
          - name: social
            label: "Réseaux sociaux"
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { name: label, label: "Réseau", widget: string }
              - { name: href, label: "Lien", widget: string }
              - { name: icon, label: "Icône", widget: select, options: [instagram, tiktok, facebook, youtube, x, linkedin] }
              - { name: handle, label: "Identifiant (@…)", widget: string, required: false }
              - { name: blurb, label: "Petite description", widget: string, required: false }
